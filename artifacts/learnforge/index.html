<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>LearnForge — AI-powered test prep for students</title>
    <meta name="description" content="LearnForge turns any subject, college course, document, or career goal into a realistic practice exam — the real test, at full length, with fresh questions every time and an instant explanation for every answer. From passing the next class to earning a high school diploma, a college degree, or a professional certification, it meets every student right where they are." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="LearnForge — AI-powered test prep for students" />
    <meta property="og:description" content="Turn any subject, college course, document, or career goal into a realistic practice exam, with fresh questions every time and an instant explanation for every answer. From passing the next class to a high school diploma, college degree, or professional certification — it meets every student right where they are." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LearnForge — AI-powered test prep for students" />
    <meta name="twitter:description" content="Turn any subject, college course, document, or career goal into a realistic practice exam, with fresh questions every time and an instant explanation for every answer. From passing the next class to a high school diploma, college degree, or professional certification — it meets every student right where they are." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1144D0" />

    <!-- Preconnect to speed up Clerk auth JS download -->
    <link rel="preconnect" href="https://clerk.learnforge.app" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <!-- Google Fonts — non-blocking (swap after load, no render delay) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <!-- Instant loading screen — visible before any JS executes -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: #ffffff;
      }
      #root:empty + #app-loading {
        display: flex;
      }
      #app-loading {
        display: none;
        position: fixed;
        inset: 0;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        z-index: 9999;
        gap: 20px;
      }
      #app-loading .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #app-loading .brand-icon {
        width: 36px;
        height: 36px;
        background: #1144D0;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app-loading .brand-icon svg {
        width: 22px;
        height: 22px;
        fill: #ffffff;
      }
      #app-loading .brand-name {
        font-size: 22px;
        font-weight: 700;
        color: #0f172a;
        letter-spacing: -0.3px;
      }
      #app-loading .brand-name span {
        color: #f97316;
      }
      #app-loading .spinner {
        width: 28px;
        height: 28px;
        border: 2.5px solid #e2e8f0;
        border-top-color: #1144D0;
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Shown instantly while JS loads; hidden once React mounts (#root gains children) -->
    <div id="app-loading" aria-label="Loading LearnForge…" role="status">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3L2 8l10 5 10-5-10-5zM2 13l10 5 10-5M2 18l10 5 10-5"/>
          </svg>
        </div>
        <span class="brand-name">Learn<span>Forge</span></span>
      </div>
      <div class="spinner"></div>
    </div>

    <script>
      // Hide the loading screen as soon as React populates #root
      (function () {
        var root = document.getElementById('root');
        var loader = document.getElementById('app-loading');
        if (!root || !loader) return;
        loader.style.display = 'flex';
        var observer = new MutationObserver(function () {
          if (root.firstChild) {
            loader.style.display = 'none';
            observer.disconnect();
          }
        });
        observer.observe(root, { childList: true });
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
